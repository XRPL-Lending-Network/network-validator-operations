name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install yamllint==1.37.1
      - run: yamllint -c .yamllint.yml .
      # The working inventory and group_vars hold real addresses and, once
      # filled in, Vault-encrypted keys. Fail if .gitignore stops covering
      # them, starts hiding the examples, or a tracked file already matches.
      - name: Private inventory and vars are gitignored
        run: |
          for f in ansible/inventory.yml ansible/group_vars/all.yml \
                   ansible/group_vars/stock.yml ansible/group_vars/validators.yml; do
            git check-ignore --no-index -q "$f" || { echo "::error::$f is not gitignored"; exit 1; }
          done
          for f in ansible/inventory.example.yml ansible/group_vars/all.example.yml \
                   ansible/group_vars/stock.example.yml ansible/group_vars/validators.example.yml; do
            if git check-ignore --no-index -q "$f"; then echo "::error::$f is gitignored"; exit 1; fi
          done
          tracked=$(git ls-files -ci --exclude-standard)
          test -z "$tracked" || { echo "::error::tracked files match .gitignore: $tracked"; exit 1; }

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ansible-core ansible-lint
      # --syntax-check parses the playbook, the role and every task file it
      # imports. It does not evaluate variables, so the example inventory is
      # enough: the real one is gitignored and never exists in CI.
      - name: Syntax check
        run: ansible-playbook -i inventory.example.yml playbooks/site.yml --syntax-check
      # Runs from ansible/ so that ansible.cfg applies and roles/ resolves;
      # the .ansible-lint config is picked up from the repository root.
      - name: Lint
        run: ansible-lint
