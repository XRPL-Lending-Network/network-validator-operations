[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent

# Readable diffs without a callback plugin. An earlier version of this file
# set stdout_callback = yaml, which was removed from community.general in
# version 12 and now aborts the run outright on a current ansible-core. The
# built-in option below does the same job and does not depend on a collection.
result_format = yaml

[ssh_connection]
pipelining = True
