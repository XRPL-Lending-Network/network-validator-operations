---
- name: Assert the network is one we know
  ansible.builtin.assert:
    that:
      - xrpl_network in xrpld_networks
    fail_msg: >-
      xrpl_network='{{ xrpl_network | default("(unset)") }}' is not described
      in xrpld_networks. Add it there rather than hardcoding values in tasks:
      the peer port and the validator list differ per network and getting
      either wrong fails in a way that looks like the node working.
  tags: [xrpld, always]

- name: Assert the node role is one we know
  ansible.builtin.assert:
    that:
      - xrpld_node_role in ['stock', 'validator']
    fail_msg: >-
      xrpld_node_role='{{ xrpld_node_role | default("(unset)") }}' is not
      supported. Use either 'stock' or 'validator'. The defaults and the config
      template branch on this value in opposite ways, so anything else renders
      a node that is half one role and half the other.
  tags: [xrpld, always]

- name: APT repository
  ansible.builtin.import_tasks: repo.yml
  tags: [xrpld, repo]

- name: Install package
  ansible.builtin.import_tasks: install.yml
  tags: [xrpld, install]

- name: Configuration
  ansible.builtin.import_tasks: config.yml
  tags: [xrpld, config]

- name: Service
  ansible.builtin.import_tasks: service.yml
  tags: [xrpld, service]
