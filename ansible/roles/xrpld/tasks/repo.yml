---
# The repository task carries its own tag. That matters more than it looks:
# switching apt channel and then running with --tags install,service leaves
# apt pointing at the old channel, and the install fails with "no available
# installation candidate" for a version that plainly exists. Cost us an hour.

# xrpld_apt_component and the apt_component key of the network map used to
# name the channel on the old repository. Failing beats ignoring them: an
# ignored override installs from a channel nobody chose.
- name: Assert the old channel settings are not used
  ansible.builtin.assert:
    that:
      - xrpld_apt_component is not defined
      - xrpld_net.apt_component is not defined
    fail_msg: >-
      xrpld_apt_component and the apt_component key in xrpld_networks are no
      longer used. Set the channel with xrpld_apt_channel, or apt_channel in
      the network map (stable, rc, beta or develop); packages come from
      packages.xrplf.org.

# deb822_repository needs python3-debian on the managed host, and a minimal
# image does not always have it. Without it the repository tasks below fail
# before they write anything. In --check mode this task installs nothing, so a
# check run on a host that lacks the library still stops at them; install it
# first or let the first run be a real one.
- name: Install the library the repository task needs
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

# Hosts set up by earlier versions of this role still have the old source. It
# can only ever offer older packages, so it goes.
- name: Remove the old repos.ripple.com source
  ansible.builtin.deb822_repository:
    name: ripple
    state: absent
  register: xrpld_old_repo

- name: Add the XRP Ledger Foundation apt repository
  ansible.builtin.deb822_repository:
    name: xrplf
    types: [deb]
    uris: "{{ xrpld_apt_repo_url }}"
    suites: [any]
    components: [main]
    signed_by: "{{ xrpld_apt_key_url }}"
    state: present
    enabled: true
  register: xrpld_repo

# Not a handler on purpose. Handlers run at the end of the play, and the
# cache has to be current before the install task a few lines later --
# otherwise a channel switch and an install in the same run fails with
# "no available installation candidate" for a version that exists.
- name: Update apt cache after a repository change  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: xrpld_repo is changed or xrpld_old_repo is changed
